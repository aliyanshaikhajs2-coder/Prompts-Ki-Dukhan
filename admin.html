<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <div id="loginBox" class="admin-container">

        <h1>Admin Login</h1>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter Email"
        >

        <br><br>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
        >

        <br><br>

        <button
            id="loginBtn"
            class="view-btn">
            Login
        </button>

    </div>



    <!-- =========================
         ADMIN DASHBOARD
    ========================== -->

    <div
        id="dashboard"
        class="admin-container"
        style="display:none;"
    >

        <h1>Admin Dashboard</h1>


        <!-- LOGOUT BUTTON -->

        <button
            id="logoutBtn"
            class="view-btn">
            Logout
        </button>


        <h2>Add New Prompt</h2>


        <!-- =========================
             PROMPT FORM
        ========================== -->

        <form id="promptForm">

            <label>Prompt Title</label>

            <input
                type="text"
                id="title"
                placeholder="Enter prompt title"
                required
            >


            <label>Category</label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Products">
                    Products
                </option>

                <option value="Portrait">
                    Portrait
                </option>

                <option value="Cinematic">
                    Cinematic
                </option>

                <option value="Aesthetic">
                    Aesthetic
                </option>

                <option value="Cartoon & Anime">
                    Cartoon & Anime
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Festival">
                    Festival
                </option>

                <option value="Birthday">
                    Birthday
                </option>

                <option value="Selfie">
                    Selfie
                </option>

                <option value="Horror">
                    Horror
                </option>

                <option value="Wedding">
                    Wedding
                </option>

                <option value="Girls">
                    Girls
                </option>

                <option value="Boys">
                    Boys
                </option>

                <option value="Couple">
                    Couple
                </option>

                <option value="Cars">
                    Cars
                </option>

            </select>


            <label>Image</label>

            <input
                type="file"
                id="image"
                accept="image/*"
                required
            >


            <label>Short Description</label>

            <textarea
                id="description"
                placeholder="Enter short description"
                required
            ></textarea>


            <label>AI Prompt</label>

            <textarea
                id="prompt"
                placeholder="Enter complete AI prompt"
                required
            ></textarea>


            <button
                type="submit"
                id="submitBtn">
                + Add Prompt
            </button>

        </form>



        <!-- =========================
             MANAGE PROMPTS
        ========================== -->

        <div class="manage-section">

            <h2>Manage Prompts</h2>

            <div id="adminPromptList"></div>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ADMIN JAVASCRIPT -->

    <script src="admin.js"></script>


</body>

</html>
