<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Details - Prompt Ki Dukaan</title>

    <meta
        name="description"
        content="View detailed AI image prompts on Prompt Ki Dukaan."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="prompt-detail">


        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>


        <div id="promptDetails">

            <p>
                Loading prompt...
            </p>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =========================
        // SUPABASE CONFIG
        // =========================

        const supabaseUrl =
            "https://uaihfdlpfryvgvrmnmjc.supabase.co";

        const supabaseKey =
            "sb_publishable_n9njImEoqHVhf4l7Ap9Oxw_GHw1ZTws";


        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );



        // =========================
        // GET PROMPT ID FROM URL
        // =========================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const promptId =
            params.get("id");



        // =========================
        // LOAD PROMPT
        // =========================

        async function loadPromptDetails() {

            const details =
                document.getElementById(
                    "promptDetails"
                );


            if (!promptId) {

                details.innerHTML = `

                    <h1>
                        Prompt Not Found ❌
                    </h1>

                    <p>
                        No prompt ID was provided.
                    </p>

                `;

                return;
            }



            const { data, error } =
                await supabaseClient
                    .from("prompts")
                    .select("*")
                    .eq("id", promptId)
                    .single();



            if (error || !data) {

                console.log(
                    "PROMPT DETAIL ERROR:",
                    error
                );


                details.innerHTML = `

                    <h1>
                        Prompt Not Found ❌
                    </h1>

                    <p>
                        Ye prompt available nahi hai.
                    </p>

                `;

                return;
            }



            // =========================
            // SHOW PROMPT
            // =========================

            details.innerHTML = `

                <img
                    src="${data.image}"
                    alt="${data.title}"
                    class="detail-image"
                >


                <h1>
                    ${data.title}
                </h1>


                <p>

                    <strong>
                        Category:
                    </strong>

                    ${data.category}

                </p>


                <p class="detail-description">

                    ${data.description}

                </p>


                <h2>
                    AI Prompt
                </h2>


                <div class="full-prompt">

                    ${data.prompt}

                </div>


                <button
                    id="copyPromptBtn"
                    class="view-btn"
                >
                    📋 Copy Prompt
                </button>

            `;



            // =========================
            // COPY BUTTON
            // =========================

            document
                .getElementById("copyPromptBtn")
                .addEventListener(
                    "click",
                    function () {

                        navigator
                            .clipboard
                            .writeText(
                                data.prompt
                            )
                            .then(
                                function () {

                                    alert(
                                        "Prompt Copied Successfully! 📋"
                                    );

                                }
                            );

                    }
                );

        }



        // =========================
        // START
        // =========================

        loadPromptDetails();

    </script>


</body>

</html>
